services:
  postgres-db:
    image: postgres:16-alpine
    container_name: pethealth_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789qwerty
      POSTGRES_DB: pethealth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: